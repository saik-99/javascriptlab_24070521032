<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login</title>
    
    <!-- 
      EXTERNAL JAVASCRIPT DEMO:
      In a real project, you would save the script below as 'script.js' 
      and uncomment the line below to load it.
    -->
    <!-- <script src="script.js"></script> -->

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 0.5rem; }
        .subtitle { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .form-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #34495e; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box; /* Ensures padding doesn't widen element */
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }

        #welcome-message {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e8f6f3;
            border: 1px solid #a3e4d7;
            border-radius: 6px;
            color: #16a085;
            display: none; /* Hidden by default */
        }
        .debug-info {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #95a5a6;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>

    <!-- INTERNAL JAVASCRIPT -->
    <script>
        // This simulates the content of an external file
        function handleLogin() {
            const studentId = document.getElementById('studentId').value;
            const password = document.getElementById('password').value;
            const welcomeDiv = document.getElementById('welcome-message');
            const debugLog = document.getElementById('debug-log');

            // 1. console.log: General information
            console.log("Attempting login for Student ID:", studentId);

            // 2. console.warn: Warning for weak passwords
            if (password.length < 6) {
                console.warn("Warning: Password is too short (less than 6 chars).");
            }

            // 3. console.error: Error handling for empty fields
            if (!studentId || !password) {
                console.error("Login Failed: Missing credentials.");
                alert("Please enter both Student ID and Password.");
                return;
            }

            // 4. console.table: Displaying data object
            const studentData = {
                id: studentId,
                status: "Authenticated",
                time: new Date().toLocaleTimeString()
            };
            console.table([studentData]);

            // 5. console.debug: Detailed trace (only visible in debug mode usually)
            console.debug("DOM elements updated. Showing welcome message.");

            // Update UI
            welcomeDiv.style.display = 'block';
            welcomeDiv.innerHTML = `
                <strong>Welcome back, Student ${studentId}!</strong><br>
                Login successful at ${studentData.time}.
            `;

            // Update debug log on screen
            debugLog.textContent = `Last action: Login verified. ID: ${studentId}`;
        }
    </script>
</head>
<body>

    <div class="login-card">
        <h1>Student Portal</h1>
        <div class="subtitle">Secure Login System</div>

        <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" placeholder="e.g., S12345">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <!-- INLINE JAVASCRIPT -->
        <!-- This calls the function defined in the <script> tag above -->
        <button onclick="handleLogin()">Login</button>

        <div id="welcome-message"></div>
        
        <div class="debug-info">
            <span id="debug-log">System Ready</span>
        </div>
    </div>

    <script>
        // Optional: Log a startup message when the page loads
        console.info("Student Portal loaded successfully.");
        console.log("Press F12 to open Developer Tools and see the console output.");
    </script>
</body>
</html>
