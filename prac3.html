<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Grade Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 350px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      margin-top: 15px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 4px;
      font-weight: bold;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Grade Calculator</h2>
    <label for="math">Math:</label>
    <input type="number" id="math" placeholder="Enter marks">

    <label for="science">Science:</label>
    <input type="number" id="science" placeholder="Enter marks">

    <label for="english">English:</label>
    <input type="number" id="english" placeholder="Enter marks">

    <label for="history">History:</label>
    <input type="number" id="history" placeholder="Enter marks">

    <button onclick="calculateGrade()">Calculate</button>

    <div id="output" class="result"></div>
  </div>

  <script>
    function calculateGrade() {
      let math = parseFloat(document.getElementById("math").value) || 0;
      let science = parseFloat(document.getElementById("science").value) || 0;
      let english = parseFloat(document.getElementById("english").value) || 0;
      let history = parseFloat(document.getElementById("history").value) || 0;

      let total = math + science + english + history;
      let average = total / 4;
      let grade = "";

      if (average >= 90) grade = "A";
      else if (average >= 75) grade = "B";
      else if (average >= 60) grade = "C";
      else if (average >= 40) grade = "D";
      else grade = "F";

      document.getElementById("output").innerHTML =
        `Total: ${total}<br>Average: ${average.toFixed(2)}<br>Grade: ${grade}`;
    }
  </script>
</body>
</html>
