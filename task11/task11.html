<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .timer-display {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 25px;
            border-radius: 12px;
            min-width: 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .time-value {
            font-size: 3rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .time-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            opacity: 0.7;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .time-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .time-inputs input {
            width: 70px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-align: center;
            font-size: 1rem;
        }

        .time-inputs input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .time-inputs input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .btn-start {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-pause {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: #fff;
        }

        .btn-pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: #fff;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(108, 117, 125, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .finished {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .message {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #00d4ff;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱ Countdown Timer</h1>

        <div class="input-section">
            <label>Set Timer (hours, minutes, seconds):</label>
            <div class="time-inputs">
                <input type="number" id="hours" placeholder="00" min="0" max="99">
                <input type="number" id="minutes" placeholder="00" min="0" max="59">
                <input type="number" id="seconds" placeholder="00" min="0" max="59">
            </div>
        </div>

        <div class="timer-display">
            <div class="time-unit">
                <div class="time-value" id="display-hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="display-minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="display-seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-start" id="startBtn">Start</button>
            <button class="btn-pause" id="pauseBtn" disabled>Pause</button>
            <button class="btn-reset" id="resetBtn">Reset</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        let countdownInterval = null;
        let totalSeconds = 0;
        let isRunning = false;

        const hoursInput = document.getElementById('hours');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        const displayHours = document.getElementById('display-hours');
        const displayMinutes = document.getElementById('display-minutes');
        const displaySeconds = document.getElementById('display-seconds');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const message = document.getElementById('message');

        function updateDisplay() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            displayHours.textContent = String(h).padStart(2, '0');
            displayMinutes.textContent = String(m).padStart(2, '0');
            displaySeconds.textContent = String(s).padStart(2, '0');
        }

        function startTimer() {
            if (isRunning) return;

            // Get input values only on first start
            if (totalSeconds === 0) {
                const h = parseInt(hoursInput.value) || 0;
                const m = parseInt(minutesInput.value) || 0;
                const s = parseInt(secondsInput.value) || 0;
                totalSeconds = h * 3600 + m * 60 + s;
            }

            if (totalSeconds <= 0) {
                message.textContent = '⚠ Please set a time first!';
                return;
            }

            isRunning = true;
            message.textContent = '';
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            hoursInput.disabled = true;
            minutesInput.disabled = true;
            secondsInput.disabled = true;

            updateDisplay();

            countdownInterval = setInterval(() => {
                totalSeconds--;
                updateDisplay();

                if (totalSeconds <= 0) {
                    clearInterval(countdownInterval);
                    isRunning = false;
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                    hoursInput.disabled = false;
                    minutesInput.disabled = false;
                    secondsInput.disabled = false;
                    message.textContent = '🎉 Time\'s up!';
                    displayHours.parentElement.classList.add('finished');
                    displayMinutes.parentElement.classList.add('finished');
                    displaySeconds.parentElement.classList.add('finished');
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;

            clearInterval(countdownInterval);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            message.textContent = '⏸ Timer paused';
        }

        function resetTimer() {
            clearInterval(countdownInterval);
            isRunning = false;
            totalSeconds = 0;

            updateDisplay();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            hoursInput.disabled = false;
            minutesInput.disabled = false;
            secondsInput.disabled = false;
            message.textContent = '';

            document.querySelectorAll('.finished').forEach(el => {
                el.classList.remove('finished');
            });
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Allow Enter key to start
        [hoursInput, minutesInput, secondsInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startTimer();
            });
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
